<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청소분담실</title>
  <link rel="preload" as="image" href="./images/mascot-sweep.png">
  <style>
    :root {
      --blue: #004EA2;
      --blue-dark: #003d82;
      --blue-soft: #eaf1fa;
      --pink: #F331A5;
      --pink-soft: #fdeaf6;
      --yellow: #FDBE25;
      --yellow-soft: #fff6de;
      --bg: #f7f8fa;
      --card: #ffffff;
      --ink: #191f28;
      --sub: #4e5968;
      --muted: #8b95a1;
      --line: #f2f4f6;
      --field: #e5e8eb;
      --shadow: 0 12px 32px rgba(17, 31, 60, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: -0.2px;
    }
    button, input { font: inherit; }
    button { border: 0; cursor: pointer; }
    .app {
      width: min(460px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 32px 20px;
      display: grid;
      align-content: center;
      gap: 20px;
    }
    .hero { text-align: center; padding: 6px 6px 0; }
    .badge {
      display: inline-grid;
      place-items: center;
      width: 112px;
      height: 112px;
      margin-bottom: 14px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, rgba(253,190,37,.32), rgba(243,49,165,.12) 68%, #eef1f4 70%);
      animation: float 2.6s ease-in-out infinite;
    }
    .badge img {
      width: 94px;
      height: 94px;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(17,31,60,.12));
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    h1 { margin: 0; font-size: 30px; line-height: 1.25; font-weight: 800; letter-spacing: -0.6px; }
    .intro {
      margin: 12px auto 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.55;
      font-weight: 600;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 24px 20px;
    }
    .step { display: none; }
    .step.active { display: block; }
    .field { display: grid; gap: 8px; margin-bottom: 18px; }
    .field span { font-size: 14px; font-weight: 700; color: var(--sub); }
    input, .date-button {
      width: 100%;
      min-height: 54px;
      border: 1.5px solid var(--field);
      border-radius: 14px;
      background: #fff;
      padding: 15px 16px;
      color: var(--ink);
      outline: 0;
      font-weight: 700;
    }
    input::placeholder { color: #b0b8c1; font-weight: 600; }
    input:focus, .date-button:focus-visible {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(0, 78, 162, .12);
    }
    .date-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }
    .date-value { font-size: 16px; }
    .date-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--blue-soft);
      color: var(--blue);
      font-size: 20px;
      flex: 0 0 auto;
    }
    .chip {
      min-height: 42px;
      border-radius: 999px;
      background: #f2f4f6;
      color: var(--sub);
      font-weight: 700;
    }
    .chip.active { background: var(--blue-soft); color: var(--blue); }
    .section-label {
      margin: 4px 0 12px;
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
    }
    .settings-card {
      display: grid;
      gap: 12px;
      margin: 18px 0;
      padding: 16px;
      border-radius: 18px;
      background: #f7f8fa;
      border: 1px solid var(--line);
    }
    .setting-row { display: grid; gap: 8px; }
    .setting-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
    }
    .setting-count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .toggle-select {
      min-height: 44px;
      border-radius: 12px;
      background: #fff;
      color: var(--sub);
      border: 1.5px solid var(--field);
      font-weight: 700;
    }
    .chip-panel {
      display: none;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
    }
    .chip-panel.open { display: grid; }
    .select-chip {
      min-height: 38px;
      padding: 0 8px;
      border-radius: 12px;
      background: #fff;
      border: 1.5px solid var(--field);
      color: var(--sub);
      font-size: 12px;
      font-weight: 700;
    }
    .select-chip.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: 0 6px 12px rgba(0, 78, 162, .2);
    }
    .warn-note {
      display: none;
      margin: 0;
      padding: 11px 13px;
      border-radius: 12px;
      background: var(--yellow-soft);
      color: #8a6d00;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }
    .warn-note.show { display: block; }
    .seat-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .seat {
      min-height: 48px;
      border-radius: 14px;
      background: #f2f4f6;
      color: var(--sub);
      font-weight: 700;
      border: 1.5px solid transparent;
      transition: transform .05s ease;
    }
    .seat:active { transform: scale(.96); }
    .seat.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
      box-shadow: 0 8px 16px rgba(0, 78, 162, .24);
    }
    .seat.disabled {
      cursor: not-allowed;
      background: #f7f8fa;
      border-color: var(--line);
      color: #c4ccd4;
    }
    .seat .disabled-text {
      display: block;
      margin-top: 2px;
      font-size: 10px;
      font-weight: 800;
      color: #c4ccd4;
    }
    .submit, .next {
      width: 100%;
      min-height: 56px;
      margin-top: 6px;
      border-radius: 16px;
      background: var(--blue);
      color: #fff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 10px 20px rgba(0, 78, 162, .22);
      transition: transform .05s ease;
    }
    .submit:active, .next:active { transform: scale(.99); }
    .back-button {
      width: 100%;
      min-height: 50px;
      margin-top: 10px;
      border-radius: 14px;
      background: #f2f4f6;
      color: var(--sub);
      font-weight: 700;
    }
    .hint {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
      text-align: center;
      font-weight: 600;
    }
    .selected-info {
      margin: 0 0 16px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--blue-soft);
      border: 1px solid #dbe7f5;
      color: var(--blue);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 800;
      text-align: center;
    }
    .guide-card {
      margin: 0 0 16px;
      padding: 16px;
      border-radius: 16px;
      background: var(--yellow-soft);
      border: 1px solid #fcecc0;
      color: var(--sub);
      font-size: 13px;
      line-height: 1.5;
      font-weight: 600;
    }
    .guide-card strong {
      display: block;
      margin-bottom: 6px;
      color: #97730a;
      font-size: 14px;
      font-weight: 800;
    }
    .guide-card ol { margin: 0; padding-left: 19px; }
    .guide-card li { margin: 3px 0; }
    .shared-notice {
      display: none;
      margin: 0 0 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: var(--pink-soft);
      border: 1px solid #f9d4ea;
      color: #c01e7f;
      font-size: 13px;
      line-height: 1.45;
      font-weight: 700;
    }
    .shared-notice.show { display: block; }
    .calendar-backdrop {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 16px;
      background: rgba(23, 31, 40, .4);
    }
    .calendar-backdrop.open { display: flex; }
    .calendar-sheet {
      width: min(430px, 100%);
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 28px 80px rgba(23, 31, 40, .28);
      padding: 20px;
      animation: sheetIn .2s ease-out;
    }
    @keyframes sheetIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .calendar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .month-title { font-size: 18px; font-weight: 800; }
    .month-nav {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f2f4f6;
      color: var(--sub);
      font-size: 22px;
      font-weight: 800;
    }
    .week, .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .week span {
      padding: 8px 0;
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .day {
      aspect-ratio: 1;
      border-radius: 12px;
      background: transparent;
      color: var(--sub);
      font-weight: 700;
    }
    .day.blank { pointer-events: none; }
    .day.today { border: 1.5px solid var(--blue); color: var(--blue); }
    .day.selected {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 8px 16px rgba(0, 78, 162, .24);
    }
    .calendar-foot {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }
    .calendar-foot button {
      flex: 1;
      min-height: 46px;
      border-radius: 12px;
      background: #f2f4f6;
      color: var(--sub);
      font-weight: 800;
    }
    .calendar-foot .today-btn { background: var(--blue-soft); color: var(--blue); }
    @media (max-width: 380px) {
      .app { padding-inline: 14px; }
      .card { padding: 20px 16px; border-radius: 20px; }
      .seat-grid { grid-template-columns: repeat(3, 1fr); }
      .chip-panel { grid-template-columns: repeat(3, 1fr); }
      h1 { font-size: 27px; }
      .calendar-sheet { padding: 16px; border-radius: 20px; }
      .day { border-radius: 11px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <div class="badge" aria-hidden="true"><img src="./images/mascot-sweep.png" alt=""></div>
      <h1 id="heroTitle">PA 랜덤청소분담</h1>
      <p class="intro" id="heroIntro">호실과 날짜를 입력하면<br>16개 청소 역할이 자동으로 배정됩니다.</p>
    </section>

    <form class="card" id="entryForm">
      <section class="step active" id="stepOne">
        <p class="section-label">입력</p>
        <label class="field">
          <span>호실</span>
          <input id="roomInput" name="room" inputmode="numeric" autocomplete="off" placeholder="예) 202" required>
        </label>

        <div class="field">
          <span>청소점검 날짜</span>
          <button class="date-button" id="dateButton" type="button" aria-haspopup="dialog">
            <span class="date-value" id="dateDisplay"></span>
            <span class="date-icon" aria-hidden="true">▦</span>
          </button>
        </div>

        <section class="settings-card" aria-label="선택 설정">
          <p class="section-label" style="margin:0">선택 설정</p>
          <label class="field" style="margin-bottom:0">
            <span>참여 인원</span>
            <input id="memberCountInput" type="number" min="1" max="16" value="16">
          </label>
          <div class="setting-row">
            <div class="setting-head">
              <span>제외 인원</span>
              <span class="setting-count" id="excludeSeatCount">없음</span>
            </div>
            <button class="toggle-select" id="toggleExcludeSeats" type="button">제외 인원 선택</button>
            <div class="chip-panel" id="excludeSeatPanel"></div>
            <p class="warn-note" id="excludeSeatNote">제외 인원이 있을 경우, 남은 인원에게 일부 청소 역할이 추가 배정될 수 있습니다.</p>
          </div>
          <div class="setting-row">
            <div class="setting-head">
              <span>제외 역할</span>
              <span class="setting-count" id="excludeRoleCount">없음</span>
            </div>
            <button class="toggle-select" id="toggleExcludeRoles" type="button">제외 역할 선택</button>
            <div class="chip-panel" id="excludeRolePanel"></div>
          </div>
        </section>

        <button class="next" id="nextButton" type="button">랜덤 청소분담 시작</button>
      </section>

      <section class="step" id="stepTwo">
        <p class="shared-notice" id="sharedNotice">공유된 청소분담 링크입니다.<br>내 침대번호를 선택하면 내 청소분담을 볼 수 있어요.</p>
        <div class="selected-info" id="selectedInfo"></div>
        <div class="guide-card">
          <strong>사용방법</strong>
          <ol>
            <li>내 침대번호를 선택해주세요.</li>
            <li>내 청소분담이 맨 위에 표시됩니다.</li>
            <li>청소 후 PA 확인표에 이름 또는 싸인을 남겨주세요.</li>
          </ol>
        </div>
        <div class="field">
          <span>내 침대번호</span>
          <div class="seat-grid" id="seatGrid"></div>
        </div>
        <button class="submit" type="submit">청소분담 뽑기 시작</button>
        <button class="back-button" id="backButton" type="button">호실/날짜 다시 선택</button>
      </section>
    </form>
  </main>

  <div class="calendar-backdrop" id="calendarBackdrop" role="dialog" aria-modal="true" aria-labelledby="calendarTitle">
    <section class="calendar-sheet">
      <div class="calendar-head">
        <button class="month-nav" id="prevMonth" type="button" aria-label="이전 달">‹</button>
        <div class="month-title" id="calendarTitle"></div>
        <button class="month-nav" id="nextMonth" type="button" aria-label="다음 달">›</button>
      </div>
      <div class="week" aria-hidden="true">
        <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
      </div>
      <div class="days" id="calendarDays"></div>
      <div class="calendar-foot">
        <button class="today-btn" id="todayButton" type="button">오늘</button>
        <button id="closeCalendar" type="button">닫기</button>
      </div>
    </section>
  </div>

  <script>
    const seats = ["1-1","1-2","2-1","2-2","3-1","3-2","4-1","4-2","5-1","5-2","6-1","6-2","7-1","7-2","8-1","8-2"];
    const roleOptions = [
      { id: 1, name: "현관 및 신발장" },
      { id: 2, name: "세면대 얼룩·물기 제거" },
      { id: 3, name: "세면대 거울" },
      { id: 4, name: "샤워실 1" },
      { id: 5, name: "샤워실 2" },
      { id: 6, name: "샤워실 3" },
      { id: 7, name: "변기·바닥 1" },
      { id: 8, name: "변기·바닥 2" },
      { id: 9, name: "변기·바닥 3" },
      { id: 10, name: "변기·바닥 4" },
      { id: 11, name: "휴지통 비우기" },
      { id: 12, name: "거실 쓸기" },
      { id: 13, name: "거실 닦기 1" },
      { id: 14, name: "거실 닦기 2" },
      { id: 15, name: "베란다 쓸기" },
      { id: 16, name: "베란다 닦기" }
    ];
    const params = new URLSearchParams(location.search);
    const roomInput = document.getElementById("roomInput");
    const seatGrid = document.getElementById("seatGrid");
    const dateDisplay = document.getElementById("dateDisplay");
    const calendarBackdrop = document.getElementById("calendarBackdrop");
    const calendarDays = document.getElementById("calendarDays");
    const hasSharedRoomDate = Boolean(normalizeRoom(params.get("room")) && isValidDate(params.get("date")));
    let selectedSeat = "";
    let selectedDate = isValidDate(params.get("date")) ? params.get("date") : todayLocal();
    let calendarCursor = parseDate(selectedDate);
    const excludedSeats = new Set(parseList(params.get("excludeSeats")).filter((value) => seats.includes(value)));
    const excludedRoles = new Set(parseList(params.get("excludeRoles")).map(Number).filter((value) => roleOptions.some((role) => role.id === value)));

    function todayLocal() {
      const d = new Date();
      return formatDate(d);
    }
    function formatDate(date) {
      return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
    }
    function displayDate(value) {
      return value.replace(/-/g, ".");
    }
    function parseDate(value) {
      const [y, m, d] = value.split("-").map(Number);
      return new Date(y, m - 1, d);
    }
    function isValidDate(value) {
      return /^\d{4}-\d{2}-\d{2}$/.test(String(value || ""));
    }
    function normalizeRoom(value) {
      return String(value || "").replace(/호/g, "").trim();
    }
    function parseList(value) {
      return String(value || "").split(",").map((item) => item.trim()).filter(Boolean);
    }
    function serializeSet(set) {
      return Array.from(set).join(",");
    }
    function updateDateDisplay() {
      dateDisplay.textContent = displayDate(selectedDate);
    }
    function updateSelectedInfo() {
      const room = normalizeRoom(roomInput.value);
      document.getElementById("selectedInfo").textContent = `${room}호 · ${displayDate(selectedDate)} 청소점검`;
    }
    function setStep(step) {
      const isStepTwo = step === 2;
      document.getElementById("stepOne").classList.toggle("active", !isStepTwo);
      document.getElementById("stepTwo").classList.toggle("active", isStepTwo);
      document.getElementById("heroTitle").textContent = isStepTwo ? "내 침대번호 선택" : "PA 랜덤청소분담";
      document.getElementById("heroIntro").innerHTML = isStepTwo
        ? "내 침대번호를 선택하면<br>내 청소분담이 맨 위에 표시됩니다."
        : "호실과 날짜를 입력하면<br>16개 청소 역할이 자동으로 배정됩니다.";
      if (isStepTwo) updateSelectedInfo();
    }
    function openCalendar() {
      calendarCursor = parseDate(selectedDate);
      renderCalendar();
      calendarBackdrop.classList.add("open");
    }
    function closeCalendar() {
      calendarBackdrop.classList.remove("open");
    }
    function renderCalendar() {
      const year = calendarCursor.getFullYear();
      const month = calendarCursor.getMonth();
      const first = new Date(year, month, 1);
      const lastDate = new Date(year, month + 1, 0).getDate();
      const today = todayLocal();
      document.getElementById("calendarTitle").textContent = `${year}년 ${month + 1}월`;
      calendarDays.innerHTML = "";
      for (let i = 0; i < first.getDay(); i += 1) {
        const blank = document.createElement("button");
        blank.type = "button";
        blank.className = "day blank";
        blank.tabIndex = -1;
        calendarDays.appendChild(blank);
      }
      for (let day = 1; day <= lastDate; day += 1) {
        const value = formatDate(new Date(year, month, day));
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day";
        btn.textContent = day;
        btn.classList.toggle("today", value === today);
        btn.classList.toggle("selected", value === selectedDate);
        btn.addEventListener("click", () => {
          selectedDate = value;
          updateDateDisplay();
          updateSelectedInfo();
          closeCalendar();
        });
        calendarDays.appendChild(btn);
      }
    }

    function updateExcludeSummary() {
      const seatCount = excludedSeats.size;
      const roleCount = excludedRoles.size;
      document.getElementById("excludeSeatCount").textContent = seatCount ? `제외 인원 ${seatCount}명 선택됨` : "없음";
      document.getElementById("excludeRoleCount").textContent = roleCount ? `제외 역할 ${roleCount}개 선택됨` : "없음";
      document.getElementById("excludeSeatNote").classList.toggle("show", seatCount > 0);
      document.querySelectorAll("#excludeSeatPanel .select-chip").forEach((chip) => {
        chip.classList.toggle("active", excludedSeats.has(chip.dataset.seat));
      });
      document.querySelectorAll("#excludeRolePanel .select-chip").forEach((chip) => {
        chip.classList.toggle("active", excludedRoles.has(Number(chip.dataset.role)));
      });
      document.querySelectorAll(".seat").forEach((button) => {
        const isExcluded = excludedSeats.has(button.dataset.seat);
        button.disabled = isExcluded;
        button.classList.toggle("disabled", isExcluded);
        button.innerHTML = isExcluded ? `${button.dataset.seat}<span class="disabled-text">제외됨</span>` : button.dataset.seat;
        if (isExcluded && selectedSeat === button.dataset.seat) selectedSeat = "";
        button.classList.toggle("active", button.dataset.seat === selectedSeat);
      });
    }

    function renderExcludePanels() {
      const seatPanel = document.getElementById("excludeSeatPanel");
      const rolePanel = document.getElementById("excludeRolePanel");
      seatPanel.innerHTML = "";
      rolePanel.innerHTML = "";
      seats.forEach((seat) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "select-chip";
        chip.textContent = seat;
        chip.dataset.seat = seat;
        chip.addEventListener("click", () => {
          if (excludedSeats.has(seat)) excludedSeats.delete(seat);
          else excludedSeats.add(seat);
          updateExcludeSummary();
        });
        seatPanel.appendChild(chip);
      });
      roleOptions.forEach((role) => {
        const chip = document.createElement("button");
        chip.type = "button";
        chip.className = "select-chip";
        chip.textContent = `${role.id}. ${role.name}`;
        chip.dataset.role = role.id;
        chip.addEventListener("click", () => {
          if (excludedRoles.has(role.id)) excludedRoles.delete(role.id);
          else excludedRoles.add(role.id);
          updateExcludeSummary();
        });
        rolePanel.appendChild(chip);
      });
      updateExcludeSummary();
    }

    function appendExcludeParams(query) {
      const seatsValue = serializeSet(excludedSeats);
      const rolesValue = serializeSet(excludedRoles);
      if (seatsValue) query.set("excludeSeats", seatsValue);
      if (rolesValue) query.set("excludeRoles", rolesValue);
      const memberCount = Number(document.getElementById("memberCountInput").value || 16);
      query.set("memberCount", String(Math.max(1, Math.min(16, memberCount))));
      return query;
    }

    roomInput.value = normalizeRoom(params.get("room")) || "202";
    document.getElementById("memberCountInput").value = params.get("memberCount") || "16";
    updateDateDisplay();
    renderExcludePanels();
    seats.forEach((seat) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "seat";
      button.textContent = seat;
      button.dataset.seat = seat;
      button.addEventListener("click", () => {
        selectedSeat = seat;
        document.querySelectorAll(".seat").forEach((el) => el.classList.toggle("active", el.dataset.seat === selectedSeat));
      });
      seatGrid.appendChild(button);
    });
    updateExcludeSummary();

    document.getElementById("dateButton").addEventListener("click", openCalendar);
    document.getElementById("toggleExcludeSeats").addEventListener("click", () => {
      document.getElementById("excludeSeatPanel").classList.toggle("open");
    });
    document.getElementById("toggleExcludeRoles").addEventListener("click", () => {
      document.getElementById("excludeRolePanel").classList.toggle("open");
    });
    document.getElementById("closeCalendar").addEventListener("click", closeCalendar);
    document.getElementById("todayButton").addEventListener("click", () => {
      selectedDate = todayLocal();
      calendarCursor = parseDate(selectedDate);
      updateDateDisplay();
      updateSelectedInfo();
      closeCalendar();
    });
    document.getElementById("prevMonth").addEventListener("click", () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() - 1, 1);
      renderCalendar();
    });
    document.getElementById("nextMonth").addEventListener("click", () => {
      calendarCursor = new Date(calendarCursor.getFullYear(), calendarCursor.getMonth() + 1, 1);
      renderCalendar();
    });
    calendarBackdrop.addEventListener("click", (event) => {
      if (event.target === calendarBackdrop) closeCalendar();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeCalendar();
    });
    document.getElementById("nextButton").addEventListener("click", () => {
      const room = normalizeRoom(roomInput.value);
      if (!room || !selectedDate) return;
      setStep(2);
    });
    document.getElementById("backButton").addEventListener("click", () => setStep(1));
    document.getElementById("entryForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const room = normalizeRoom(roomInput.value);
      if (!room || !selectedDate) return;
      if (!selectedSeat) {
        window.alert("내 침대번호를 선택해주세요.");
        return;
      }
      const query = appendExcludeParams(new URLSearchParams({ room, date: selectedDate, seat: selectedSeat }));
      location.href = `00-index.html?${query.toString()}`;
    });

    document.getElementById("sharedNotice").classList.toggle("show", hasSharedRoomDate);
    setStep(hasSharedRoomDate ? 2 : 1);
  </script>
</body>
</html>
