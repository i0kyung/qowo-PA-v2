<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청소 역할 섞는 중</title>
  <style>
    :root {
      --blue: #004EA2;
      --pink: #F331A5;
      --yellow: #FDBE25;
      --bg: #f7f8fa;
      --ink: #191f28;
      --muted: #8b95a1;
      --sub: #4e5968;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: -0.3px;
    }
    .stage {
      width: min(460px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 18px;
      display: grid;
      align-content: center;
      text-align: center;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 800; letter-spacing: -0.5px; }
    .date { margin: 12px 0 0; color: var(--muted); font-weight: 600; }
    .machine {
      position: relative;
      height: 260px;
      margin: 40px 0 28px;
    }
    .card {
      position: absolute;
      left: calc(50% - 74px);
      top: 70px;
      width: 148px;
      height: 176px;
      border-radius: 28px;
      display: grid;
      place-items: center;
      font-size: 46px;
      color: #fff;
      box-shadow: 0 18px 36px rgba(17, 31, 60, .16);
      animation: shuffle 1.65s cubic-bezier(.34,.02,.18,1) infinite;
    }
    .card:nth-child(1) { background: var(--blue); animation-delay: 0s; }
    .card:nth-child(2) { background: var(--pink); animation-delay: -.22s; }
    .card:nth-child(3) { background: var(--yellow); animation-delay: -.44s; }
    .card:nth-child(4) { background: #2f74c9; animation-delay: -.66s; }
    .card:nth-child(5) { background: #ff6dbd; animation-delay: -.88s; }
    @keyframes shuffle {
      0% { transform: translate(-72px, 10px) rotate(-14deg) scale(.9); z-index: 1; }
      24% { transform: translate(70px, -18px) rotate(12deg) scale(1); z-index: 3; }
      48% { transform: translate(20px, 28px) rotate(5deg) scale(.94); z-index: 2; }
      72% { transform: translate(-34px, -28px) rotate(-8deg) scale(1.04); z-index: 4; }
      100% { transform: translate(-72px, 10px) rotate(-14deg) scale(.9); z-index: 1; }
    }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #f2f4f6;
      box-shadow: 0 10px 22px rgba(17, 31, 60, .07);
      color: var(--sub);
      font-weight: 700;
    }
    .dots::after { content: ""; animation: dots 1s steps(4, end) infinite; }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1 id="title">청소분담 생성 중</h1>
    <p class="date" id="dateText"></p>
    <div class="machine" aria-hidden="true">
      <div class="card">👟</div>
      <div class="card">🧼</div>
      <div class="card">🚿</div>
      <div class="card">🚽</div>
      <div class="card">🧹</div>
    </div>
    <div class="status">공정 랜덤으로 청소 역할을 섞는 중<span class="dots"></span></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const room = normalizeRoom(params.get("room")) || "202";
    const date = params.get("date") || todayLocal();
    const seat = params.get("seat") || "1-1";
    const excludeSeats = params.get("excludeSeats") || "";
    const excludeRoles = params.get("excludeRoles") || "";
    const memberCount = params.get("memberCount") || "16";

    function normalizeRoom(value) {
      return String(value || "").replace(/호/g, "").trim();
    }
    function todayLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function displayDate(value) {
      return value.replace(/-/g, ".");
    }

    document.getElementById("title").textContent = `${room}호 청소분담 생성 중`;
    document.getElementById("dateText").textContent = `${displayDate(date)} 청소점검 기준`;

    window.setTimeout(() => {
      const query = new URLSearchParams({ room, date, seat });
      if (excludeSeats) query.set("excludeSeats", excludeSeats);
      if (excludeRoles) query.set("excludeRoles", excludeRoles);
      if (memberCount) query.set("memberCount", memberCount);
      location.href = `01-index.html?${query.toString()}`;
    }, 1850);
  </script>
</body>
</html>
