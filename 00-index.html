<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청소 역할 섞는 중</title>
  <style>
    :root {
      --blue: #004EA2;
      --pink: #F331A5;
      --yellow: #FDBE25;
      --bg: #f7f8fa;
      --ink: #191f28;
      --muted: #8b95a1;
      --sub: #4e5968;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: -0.3px;
    }
    .stage {
      width: min(460px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 18px;
      display: grid;
      align-content: center;
      text-align: center;
    }
    h1 { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 800; letter-spacing: -0.5px; }
    .date { margin: 12px 0 0; color: var(--muted); font-weight: 600; }
    .mascot-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 34px auto 26px;
      display: grid;
      place-items: center;
    }
    .blob {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(253,190,37,.35), rgba(243,49,165,.16) 70%, transparent 72%);
      filter: blur(2px);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .mascot-stage {
      position: relative;
      width: 200px;
      height: 200px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity .16s ease;
      filter: drop-shadow(0 12px 18px rgba(17,31,60,.14));
    }
    .frame.on { opacity: 1; }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #f2f4f6;
      box-shadow: 0 10px 22px rgba(17, 31, 60, .07);
      color: var(--sub);
      font-weight: 700;
    }
    .dots::after { content: ""; animation: dots 1s steps(4, end) infinite; }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <h1 id="title">청소분담 생성 중</h1>
    <p class="date" id="dateText"></p>
    <div class="mascot-wrap" aria-hidden="true">
      <div class="blob"></div>
      <div class="mascot-stage">
        <img class="frame" id="frameA" alt="">
        <img class="frame" id="frameB" alt="">
      </div>
    </div>
    <div class="status">공정 랜덤으로 청소 역할을 섞는 중<span class="dots"></span></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const room = normalizeRoom(params.get("room")) || "202";
    const date = params.get("date") || todayLocal();
    const seat = params.get("seat") || "1-1";
    const excludeSeats = params.get("excludeSeats") || "";
    const excludeRoles = params.get("excludeRoles") || "";
    const memberCount = params.get("memberCount") || "16";

    function normalizeRoom(value) {
      return String(value || "").replace(/호/g, "").trim();
    }
    function todayLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function displayDate(value) {
      return value.replace(/-/g, ".");
    }

    document.getElementById("title").textContent = `${room}호 청소분담 생성 중`;
    document.getElementById("dateText").textContent = `${displayDate(date)} 청소점검 기준`;

    // 청소나섬 로딩 모션: 4가지 청소 타입 중 하나를 랜덤으로 뽑아
    // 그 타입의 '전' 프레임 ↔ '후' 프레임을 왔다갔다 반복(청소하는 동작).
    const types = [
      ["./images/mascot-sweep.png",  "./images/mascot-mop.png"],    // 바닥: 쓸기 ↔ 대걸레
      ["./images/mascot-pickup.png", "./images/mascot-bin.png"],    // 쓰레기: 줍기 ↔ 버리기
      ["./images/mascot-wipe.png",   "./images/mascot-spray.png"],  // 책상: 행주 ↔ 스프레이
      ["./images/mascot-window.png", "./images/mascot-happy.png"]   // 유리: 창문 ↔ 신나게
    ];
    const pick = types[Math.floor(Math.random() * types.length)];
    const fA = document.getElementById("frameA");
    const fB = document.getElementById("frameB");
    fA.src = pick[0];
    fB.src = pick[1];
    fA.classList.add("on");
    let showA = true;
    window.setInterval(() => {
      showA = !showA;
      fA.classList.toggle("on", showA);
      fB.classList.toggle("on", !showA);
    }, 480);

    window.setTimeout(() => {
      const query = new URLSearchParams({ room, date, seat });
      if (excludeSeats) query.set("excludeSeats", excludeSeats);
      if (excludeRoles) query.set("excludeRoles", excludeRoles);
      if (memberCount) query.set("memberCount", memberCount);
      location.href = `01-index.html?${query.toString()}`;
    }, 2600);
  </script>
</body>
</html>
