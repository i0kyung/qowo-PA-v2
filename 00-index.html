<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>청소 역할 섞는 중 · 청소분담실</title>
  <meta name="description" content="호실과 날짜만 입력하면 16개 청소 역할을 공정하게 랜덤 배정해요.">
  <meta name="theme-color" content="#FFF7F3">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/app-icon-32.png">
  <link rel="icon" type="image/png" sizes="96x96" href="./images/app-icon-96.png">
  <link rel="apple-touch-icon" href="./images/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="청소분담실">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="청소분담실">
  <meta property="og:title" content="청소분담실 · PA 랜덤 청소분담">
  <meta property="og:description" content="호실과 날짜만 입력하면 16개 청소 역할을 공정하게 랜덤 배정해요. 내 청소구역과 싸인 현황까지 한눈에!">
  <meta property="og:url" content="https://i0kyung.github.io/qowo-PA-v2/">
  <meta property="og:image" content="https://i0kyung.github.io/qowo-PA-v2/images/og-poster.jpg">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="1000">
  <meta property="og:image:alt" content="청소분담실 앱 아이콘과 기숙사 알림장 소개 이미지">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    :root {
      --primary: #EF6A5D;
      --primary-2: #F8907A;
      --yellow: #FFC83D;
      --bg: #FFF7F3;
      --ink: #1F2A52;
      --muted: #8E93A8;
      --sub: #545C78;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(520px 380px at -8% -6%, rgba(248, 144, 122, .30), transparent 70%),
        radial-gradient(420px 360px at 108% 40%, rgba(255, 200, 61, .22), transparent 70%),
        radial-gradient(560px 420px at 50% 112%, rgba(239, 106, 93, .22), transparent 70%),
        var(--bg);
      color: var(--ink);
      font-family: Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: -0.3px;
    }
    .stage {
      width: min(460px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 42px 18px;
      display: grid;
      align-content: center;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 0 auto 18px;
      color: #c9463b;
      font-size: 14px;
      font-weight: 800;
    }
    .brand img { width: 28px; height: 28px; filter: drop-shadow(0 4px 8px rgba(225, 98, 86, .25)); }
    .progress {
      width: min(260px, 70%);
      height: 8px;
      margin: 0 auto 18px;
      border-radius: 999px;
      background: rgba(239, 106, 93, .14);
      overflow: hidden;
    }
    .progress i {
      display: block;
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary-2), var(--primary));
      animation: fill 2.5s cubic-bezier(.3,.1,.3,1) forwards;
    }
    @keyframes fill { to { width: 100%; } }
    h1 { margin: 0; font-size: 28px; line-height: 1.3; font-weight: 800; letter-spacing: -0.5px; }
    .date { margin: 12px 0 0; color: var(--muted); font-weight: 600; }
    .mascot-wrap {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 34px auto 26px;
      display: grid;
      place-items: center;
    }
    .blob {
      position: absolute;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, rgba(255,200,61,.42), rgba(248,144,122,.26) 66%, transparent 72%);
      filter: blur(2px);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: .9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
    .mascot-stage {
      position: relative;
      width: 200px;
      height: 200px;
      animation: bob 1.6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-10px) rotate(2deg); }
    }
    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      opacity: 0;
      transition: opacity .16s ease;
      filter: drop-shadow(0 14px 20px rgba(214,98,80,.22));
    }
    .frame.on { opacity: 1; }
    .status {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid #F5E6E1;
      box-shadow: 0 12px 26px rgba(214, 98, 80, .12);
      color: var(--sub);
      font-weight: 700;
    }
    .dots::after { content: ""; animation: dots 1s steps(4, end) infinite; }
    @keyframes dots {
      0% { content: ""; }
      25% { content: "."; }
      50% { content: ".."; }
      75%, 100% { content: "..."; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="brand"><img src="./images/app-icon-96.png" alt="" width="28" height="28">청소분담실</div>
    <h1 id="title">청소분담 생성 중</h1>
    <p class="date" id="dateText"></p>
    <div class="mascot-wrap" aria-hidden="true">
      <div class="blob"></div>
      <div class="mascot-stage">
        <img class="frame" id="frameA" alt="">
        <img class="frame" id="frameB" alt="">
      </div>
    </div>
    <div class="progress" aria-hidden="true"><i></i></div>
    <div class="status">공정 랜덤으로 청소 역할을 섞는 중<span class="dots"></span></div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const room = normalizeRoom(params.get("room")) || "202";
    const date = params.get("date") || todayLocal();
    const seat = params.get("seat") || "1-1";
    const excludeSeats = params.get("excludeSeats") || "";
    const excludeRoles = params.get("excludeRoles") || "";
    const memberCount = params.get("memberCount") || "16";

    function normalizeRoom(value) {
      return String(value || "").replace(/호/g, "").trim();
    }
    function todayLocal() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }
    function displayDate(value) {
      return value.replace(/-/g, ".");
    }

    document.getElementById("title").textContent = `${room}호 청소분담 생성 중`;
    document.getElementById("dateText").textContent = `${displayDate(date)} 청소점검 기준`;

    // 청소나섬 로딩 모션: 4가지 청소 타입 중 하나를 랜덤으로 뽑아
    // 그 타입의 '전' 프레임 ↔ '후' 프레임을 왔다갔다 반복(청소하는 동작).
    const types = [
      ["./images/mascot-sweep.png",  "./images/mascot-mop.png"],    // 바닥: 쓸기 ↔ 대걸레
      ["./images/mascot-pickup.png", "./images/mascot-bin.png"],    // 쓰레기: 줍기 ↔ 버리기
      ["./images/mascot-wipe.png",   "./images/mascot-spray.png"],  // 책상: 행주 ↔ 스프레이
      ["./images/mascot-window.png", "./images/mascot-happy.png"]   // 유리: 창문 ↔ 신나게
    ];
    const pick = types[Math.floor(Math.random() * types.length)];
    const fA = document.getElementById("frameA");
    const fB = document.getElementById("frameB");
    fA.src = pick[0];
    fB.src = pick[1];
    fA.classList.add("on");
    let showA = true;
    window.setInterval(() => {
      showA = !showA;
      fA.classList.toggle("on", showA);
      fB.classList.toggle("on", !showA);
    }, 480);

    window.setTimeout(() => {
      const query = new URLSearchParams({ room, date, seat });
      if (excludeSeats) query.set("excludeSeats", excludeSeats);
      if (excludeRoles) query.set("excludeRoles", excludeRoles);
      if (memberCount) query.set("memberCount", memberCount);
      location.href = `01-index.html?${query.toString()}`;
    }, 2600);
  </script>
</body>
</html>
